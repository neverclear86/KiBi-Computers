# 止まったテストを落とす保険のタイムアウト（合否の基準ではない。#916）。
# メソッドと @BeforeEach などに効く。クラスやメソッドの @Timeout があればそちらが優先される。
# Gradle の起動では -Pkibi.test.timeoutDefault か、ベンチマーク・StackHeadroom の起動の設定が、この値を上書きする。
junit.jupiter.execution.timeout.default = 10 m

# 止まったテストのスレッドダンプ（#927）。保険のタイムアウトが割り込む直前と assertTimeoutPreemptively の時間切れのあとに、
# 全スレッドのダンプ（ロックの持ち主つき）をファイル（kibi.test.threadDumpDir。既定は build/thread-dumps/other）に書き、
# 標準出力に「#927 ダンプ」で始まる要約を出す（ThreadDumpOnTimeout）。自動登録は、この拡張だけに絞る（ほかの jar の拡張を入れない）。
# 組み込みの junit.jupiter.execution.timeout.threaddump.enabled は、ダンプが二重になるので付けない
junit.jupiter.extensions.autodetection.enabled = true
junit.jupiter.extensions.autodetection.include = pro.ikili.kibicomputers.core.testing.ThreadDumpOnTimeout
