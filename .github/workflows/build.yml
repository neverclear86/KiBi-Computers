name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # core と Forge 1.20.1 は Java 17、NeoForge 1.21.1 は Java 21 のツールチェーンを使う
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            17
            21

      - uses: gradle/actions/setup-gradle@v6

      # WASM のビルドに使う Zig（gradle/zig.properties で固定。#9）。Gradle が初回に取得して ~/.gradle/kibicomputers/zig に置く
      - uses: actions/cache@v6
        with:
          path: ~/.gradle/kibicomputers/zig
          key: zig-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/zig.properties') }}

      # ネイティブの p2・p3 のコンポーネントをビルドする wasi-sdk（gradle/wasi-sdk.properties で固定。#775）。Gradle が初回に取得して ~/.gradle/kibicomputers/wasi-sdk に置く
      - uses: actions/cache@v6
        with:
          path: ~/.gradle/kibicomputers/wasi-sdk
          key: wasi-sdk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/wasi-sdk.properties') }}

      # WASM にビルドする C のソース（Lua など。gradle/lua.properties で固定。#91）。Gradle が取得して ~/.gradle/kibicomputers/downloads に置く
      - uses: actions/cache@v6
        with:
          path: ~/.gradle/kibicomputers/downloads
          key: wasm-sources-${{ hashFiles('gradle/lua.properties') }}

      - name: Build and test
        run: ./gradlew build --console=plain

      # 開発環境のゲームサーバーで MOD を読み込み、GameTest を実行する（失敗すると終了コードが非0）。
      # サーバーの停止が終わらないとき（#540）に、ジョブの上限（6 時間）まで待たないよう、段ごとに上限を付ける
      - name: GameTest (NeoForge 1.21.1)
        timeout-minutes: 30
        run: ./gradlew :platform-neoforge-1.21.1:runGameTestServer --console=plain

      - name: GameTest (Forge 1.20.1)
        timeout-minutes: 30
        run: ./gradlew :platform-forge-1.20.1:runGameTestServer --console=plain

      # 製品の jar（Jar-in-Jar で Endive を同梱したもの）を mods/ に置いて読み、GameTest を流す（#775）。
      # 開発環境の run は Endive を実行時クラスパスから読むので、同梱の漏れやモジュールとしての読み込みの問題はここで見つける
      - name: GameTest from the mod jar (NeoForge 1.21.1)
        timeout-minutes: 30
        run: ./gradlew :platform-neoforge-1.21.1:runJarGameTestServer --console=plain

      - name: GameTest from the mod jar (Forge 1.20.1)
        timeout-minutes: 30
        run: ./gradlew :platform-forge-1.20.1:runJarGameTestServer --console=plain

      # どこかの段が落ちたら、テスト結果の XML（テスト名・スタックトレース・system-out）と GameTest のサーバーのログを残す（#394）。
      # 不安定なテストは再実行で通ると記録が消えるので、再実行の前に調べられるようにする。
      # 名前に attempt を入れて、同じ run の再実行で名前がぶつからないようにする
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-attempt-${{ github.run_attempt }}
          path: |
            **/build/test-results/**/*.xml
            platform-*/run/logs/latest.log
            platform-*/run/jar-gametest/logs/latest.log
          if-no-files-found: ignore
          retention-days: 30

      - uses: actions/upload-artifact@v7
        with:
          name: kibicomputers-jars
          path: platform-*/build/libs/*.jar
          if-no-files-found: error
