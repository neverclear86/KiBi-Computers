name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # core と Forge 1.20.1 は Java 17、NeoForge 1.21.1 は Java 21 のツールチェーンを使う
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            17
            21

      - uses: gradle/actions/setup-gradle@v6

      # WASM のビルドに使う Zig（gradle/zig.properties で固定。#9）。Gradle が初回に取得して ~/.gradle/kibicomputers/zig に置く
      - uses: actions/cache@v6
        with:
          path: ~/.gradle/kibicomputers/zig
          key: zig-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/zig.properties') }}

      # WASM にビルドする C のソース（Lua など。gradle/lua.properties で固定。#91）。Gradle が取得して ~/.gradle/kibicomputers/downloads に置く
      - uses: actions/cache@v6
        with:
          path: ~/.gradle/kibicomputers/downloads
          key: wasm-sources-${{ hashFiles('gradle/lua.properties') }}

      - name: Build and test
        run: ./gradlew build --console=plain

      # 開発環境のゲームサーバーで MOD を読み込み、GameTest を実行する（失敗すると終了コードが非0）
      - name: GameTest (NeoForge 1.21.1)
        run: ./gradlew :platform-neoforge-1.21.1:runGameTestServer --console=plain

      - name: GameTest (Forge 1.20.1)
        run: ./gradlew :platform-forge-1.20.1:runGameTestServer --console=plain

      - uses: actions/upload-artifact@v7
        with:
          name: kibicomputers-jars
          path: platform-*/build/libs/*.jar
          if-no-files-found: error
