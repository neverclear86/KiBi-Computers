name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # core は Java 17、NeoForge 1.21.1 は Java 21 のツールチェーンを使う
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            21

      - uses: gradle/actions/setup-gradle@v5

      - name: Build and test
        run: ./gradlew build --console=plain

      # 開発環境で MOD を読み込み、WASMランタイムが動くことを確認する
      - name: Smoke test (NeoForge 1.21.1 data run)
        run: |
          ./gradlew :platform-neoforge-1.21.1:runData --console=plain | tee rundata.log
          grep -q "WASM runtime self-check passed" rundata.log

      - uses: actions/upload-artifact@v4
        with:
          name: kibicomputers-jars
          path: platform-*/build/libs/*.jar
          if-no-files-found: error
