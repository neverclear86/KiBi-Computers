[versions]
kotlin = "2.4.21"
moddev = "2.0.148"

# Minecraft / ローダー固有のバージョンは各 platform-* の gradle.properties に置く

endive = "1.2.0"
junit = "6.1.3"
# `api` 以外の public に付ける「内部」の印（`@ApiStatus.Internal`、#366）。実行時には要らない
jetbrains-annotations = "24.1.0"

# #26 Endive の性能測定（poc/endive-bench）でだけ使う。MOD には入れない
jffi = "1.4.3"

# build-logic（WASM のビルド）で使う。Zig 本体のバージョンは gradle/zig.properties
commons-compress = "1.28.0"
xz = "1.10"

[libraries]
endive-runtime = { module = "run.endive:runtime", version.ref = "endive" }
endive-wasm = { module = "run.endive:wasm", version.ref = "endive" }
endive-wasi = { module = "run.endive:wasi", version.ref = "endive" }
endive-compiler = { module = "run.endive:compiler", version.ref = "endive" }
endive-build-time-compiler = { module = "run.endive:build-time-compiler", version.ref = "endive" }
endive-redline-build-time-compiler = { module = "run.endive:redline-build-time-compiler-experimental", version.ref = "endive" }
endive-redline-runner = { module = "run.endive:redline-runner-experimental", version.ref = "endive" }
endive-redline-runner-jffi = { module = "run.endive:redline-runner-jffi-experimental", version.ref = "endive" }
jffi = { module = "com.github.jnr:jffi", version.ref = "jffi" }
jetbrains-annotations = { module = "org.jetbrains:annotations", version.ref = "jetbrains-annotations" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
commons-compress = { module = "org.apache.commons:commons-compress", version.ref = "commons-compress" }
xz = { module = "org.tukaani:xz", version.ref = "xz" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
moddev = { id = "net.neoforged.moddev", version.ref = "moddev" }
moddev-legacyforge = { id = "net.neoforged.moddev.legacyforge", version.ref = "moddev" }
