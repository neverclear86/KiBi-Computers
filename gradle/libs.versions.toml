[versions]
kotlin = "2.4.21"
moddev = "2.0.148"

# Minecraft / ローダー固有のバージョンは各 platform-* の gradle.properties に置く

chicory = "1.7.5"
junit = "6.1.3"

[libraries]
chicory-runtime = { module = "com.dylibso.chicory:runtime", version.ref = "chicory" }
chicory-wasm = { module = "com.dylibso.chicory:wasm", version.ref = "chicory" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
moddev = { id = "net.neoforged.moddev", version.ref = "moddev" }
moddev-legacyforge = { id = "net.neoforged.moddev.legacyforge", version.ref = "moddev" }
