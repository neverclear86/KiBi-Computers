[versions]
kotlin = "2.4.21"
moddev = "2.0.148"

# Minecraft / ローダー固有のバージョンは各 platform-* の gradle.properties に置く

endive = "1.2.0"
junit = "6.1.3"

[libraries]
endive-runtime = { module = "run.endive:runtime", version.ref = "endive" }
endive-wasm = { module = "run.endive:wasm", version.ref = "endive" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
moddev = { id = "net.neoforged.moddev", version.ref = "moddev" }
moddev-legacyforge = { id = "net.neoforged.moddev.legacyforge", version.ref = "moddev" }
