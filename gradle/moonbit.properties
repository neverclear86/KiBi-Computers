#
# 公式配布は版ごとに次の場所に置かれている（<版> は moonc の版。https://cli.moonbitlang.com/version.json で分かる）。
#   https://cli.moonbitlang.com/binaries/<版>/moonbit-<platform>.(tar.gz|zip)
#   https://cli.moonbitlang.com/cores/core-<版>.tar.gz
# sha256.<platform> は、各アーカイブの隣の公式の <アーカイブ>.sha256 を写す。
# sha256.core は公式の .sha256 がないので、取得したアーカイブから計算した値。
# darwin-x86_64 のツールチェーンは配布されていない。
